name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # Contract tests hit the live FPL API, which can change without notice.
  # A nightly run surfaces a breaking change before a user does.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pinned to 3.12: asyncpg and pydantic-core have no wheels for 3.14
          # yet, and building them from source needs a C toolchain.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check migrations match the models
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SECRET_KEY: ci-only
          ENVIRONMENT: test
        run: |
          # A model change without a migration is a deploy-time failure;
          # catch it here instead.
          python -c "
          import app.models
          from app.database import Base
          tables = sorted(Base.metadata.tables)
          print('Registered tables:', tables)
          assert tables, 'no tables registered'
          "

      - name: Unit and integration tests
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          REDIS_URL: redis://localhost:6379/15
          SECRET_KEY: ci-only
          ENVIRONMENT: test
        run: pytest -m "not network" -v

      - name: Contract tests against the live FPL API
        # Never fail a PR because an external service is having a bad day —
        # but do surface it loudly.
        continue-on-error: true
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SECRET_KEY: ci-only
          ENVIRONMENT: test
        run: pytest -m network -v

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      # Must precede the standalone type check. `LayoutProps` and friends are
      # generated into .next/types and reached via next-env.d.ts — both
      # gitignored, so a fresh checkout has neither and `tsc` fails with
      # "Cannot find name 'LayoutProps'". Running the build first emits them.
      # It also type-checks on its own, so a type error fails here regardless.
      - name: Production build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

      - name: Type check
        run: npx tsc --noEmit

  mobile:
    name: Mobile checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # React Native 0.86 needs ^20.19.4 || ^22.13.0
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
      - run: npx expo-doctor

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if a .env file is committed
        run: |
          for f in backend/.env frontend/.env mobile/.env; do
            if git ls-files --error-unmatch "$f" 2>/dev/null; then
              echo "::error::$f is committed — it may hold live credentials"
              exit 1
            fi
          done
          echo "No .env committed."

      - name: No backend secrets in the mobile app
        run: |
          # Everything under mobile/ ships to users' phones. Backend-only
          # setting names appearing there means a secret is about to leak.
          if grep -rInE "SUPABASE_JWT_SECRET|SERVICE_ROLE|JOB_TOKEN|DATABASE_URL|REDIS_URL|TELEGRAM_BOT_TOKEN|sk_live_|sk_test_|whsec_" \
              --exclude-dir=node_modules --exclude="README.md" --exclude=".env.example" mobile; then
            echo "::error::A backend secret name or key appears in mobile/"
            exit 1
          fi
          echo "mobile/ is clean."

      - name: Scan for hardcoded credentials
        run: |
          # Looks for real-looking secrets, not the placeholder values in
          # .env.example or the test fixtures.
          if grep -rInE \
              "(postgresql|rediss?)://[^:]+:[^@[:space:]]{8,}@" \
              --include="*.py" --include="*.ts" --include="*.tsx" \
              --include="*.yml" --include="*.json" \
              --exclude-dir=node_modules --exclude-dir=.venv . \
              | grep -v "YOUR-PASSWORD" \
              | grep -v "fpl_password" \
              | grep -v "example"; then
            echo "::error::A connection string with a real password appears in tracked files"
            exit 1
          fi
          echo "No hardcoded credentials found."
