[pytest]
testpaths = tests
python_files = test_*.py
# `python -m pytest` puts cwd on sys.path but the `pytest` entry point does
# not, so `import app` fails when run via test.bat without this.
pythonpath = .
asyncio_mode = auto
addopts = -q --strict-markers
markers =
    network: hits the live FPL API — deselect with '-m "not network"'
    slow: takes more than a second
