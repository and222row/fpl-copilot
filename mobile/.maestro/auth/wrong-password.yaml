appId: com.fplcopilot.app
name: A wrong password is refused
tags: [auth]
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "sign-in-screen"
    timeout: 30000
- tapOn:
    id: "e2e-email"
- inputText: e2e-trial@fplcopilot.test
- tapOn:
    id: "e2e-password"
- inputText: definitely-not-the-password
- hideKeyboard
- tapOn:
    id: "e2e-sign-in"
- extendedWaitUntil:
    visible:
      id: "e2e-sign-in-error"
    timeout: 20000
- assertNotVisible:
    id: "home-screen"
